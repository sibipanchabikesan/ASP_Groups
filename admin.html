<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | ASP Groups</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Rajdhani:wght@600;700&display=swap"><link rel="stylesheet" href="style.css"></head><body>
<header><div class="w bar"><a class="logo" href="index.html">ASP <b>ADMIN</b></a><a href="shop.html">View shop</a><button class="btn g" id="lo" hidden>Log out</button></div></header>
<main class="w"><p class="note" id="dm" hidden>Demo mode: data is saved only in this browser and there is no real login. Add your Firebase keys in config.js (see SETUP.md) to go live.</p>
<section class="panel" id="lg" style="max-width:380px;margin:40px auto" hidden><h2>Admin login</h2><label for="em">Email</label><input id="em" type="email" autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><p id="le" style="color:#fca5a5"></p><button class="btn" id="li">Log in</button></section>
<div id="ap" hidden><div class="tabs"><button class="btn" data-t="or">Orders</button><button class="btn g" data-t="pd">Products</button><button class="btn g" data-t="st">Settings</button></div>
<section id="or"></section>
<section id="pd" hidden><form class="panel" id="pf"><h2 id="pt">Add product</h2><div class="g2"><div><label>Name *</label><input id="pn" required></div><div><label>Category</label><input id="pc" placeholder="PC Builds"></div><div><label>Price ₹ (0 = quote)</label><input id="pp" type="number" min="0" value="0"></div><div><label>MRP ₹ (optional, shows discount)</label><input id="pm" type="number" min="0" value="0"></div><div><label>Stock (blank = unlimited)</label><input id="ps" type="number" min="0"></div><div><label>Image URL or upload</label><input id="pi" placeholder="assets/pc-building.jpg"><input id="pu" type="file" accept="image/*"></div></div><label>Description</label><textarea id="pe" rows="2"></textarea><label><input id="pa" type="checkbox" checked style="width:auto"> Visible in shop</label><p><button class="btn">Save product</button> <button type="button" class="btn g" id="pr">Clear</button></p></form>
<div class="panel tw"><table><thead><tr><th></th><th>Name</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody id="pl"></tbody></table></div></section>
<section id="st" hidden><form class="panel" id="sf"><h2>Website settings</h2><label>Shop name</label><input id="s1"><label>Announcement banner (blank = hidden)</label><input id="s2"><label>WhatsApp number with country code</label><input id="s3" placeholder="919488241710"><label>Accent colour</label><input id="s4" type="color" style="height:42px"><label><input id="s5" type="checkbox" style="width:auto"> Accept orders</label><p><button class="btn">Save settings</button> <span id="sm"></span></p></form></section></div></main>
<script type="module">
import*as S from './store.js';
const $=i=>document.getElementById(i),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),inr=n=>'₹'+Number(n).toLocaleString('en-IN');
let P=[],eid=null;$('dm').hidden=!S.isDemo;
const tab=t=>{['or','pd','st'].forEach(x=>$(x).hidden=x!==t);document.querySelectorAll('[data-t]').forEach(b=>b.className='btn'+(b.dataset.t===t?'':' g'))};
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>tab(b.dataset.t));
S.onUser(u=>{$('lg').hidden=!!u;$('ap').hidden=!u;$('lo').hidden=!u||S.isDemo;if(u)load()});
$('li').onclick=async()=>{try{await S.login($('em').value,$('pw').value)}catch{$('le').textContent='Wrong email or password.'}};$('lo').onclick=()=>S.logout();
async function load(){const[o,s]=[await S.orders().catch(()=>[]),await S.settings()];P=await S.products();ords(o);list();
 $('s1').value=s.shopName||'';$('s2').value=s.banner||'';$('s3').value=s.whatsapp||'';$('s4').value=s.accent||'#22d3ee';$('s5').checked=s.open!==false}
function ords(o){$('or').innerHTML=o.length?o.map(x=>`<div class="panel"><div class="row"><b>${e(x.id)} · ${new Date(x.created).toLocaleString('en-IN')}</b><select data-o="${e(x.id)}" style="width:auto">${['New','Confirmed','Shipped','Delivered','Cancelled'].map(s=>`<option${s===x.status?' selected':''}>${s}</option>`).join('')}</select></div><p>${x.items.map(i=>e(i.name)+' × '+i.qty).join('<br>')}</p><p><b>${inr(x.total)}</b> · ${e(x.name)} · <a href="tel:${e(x.phone)}">${e(x.phone)}</a><br>${e(x.address)}${x.notes?'<br><i>'+e(x.notes)+'</i>':''}</p></div>`).join(''):'<p>No orders yet. New orders will appear here.</p>';
 document.querySelectorAll('[data-o]').forEach(s=>s.onchange=()=>S.setStatus(s.dataset.o,s.value))}
function list(){$('pl').innerHTML=P.map(p=>`<tr><td><img src="${e(p.image||'assets/pc-building.jpg')}" alt=""></td><td>${e(p.name)}<br><small>${e(p.category)}${p.active===false?' · hidden':''}</small></td><td>${p.price>0?inr(p.price):'Quote'}</td><td>${p.stock??'∞'}</td><td><button class="btn g" data-e="${e(p.id)}">Edit</button> <button class="btn r" data-d="${e(p.id)}">Delete</button></td></tr>`).join('');
 document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const p=P.find(x=>x.id===b.dataset.e);eid=p.id;$('pt').textContent='Edit product';$('pn').value=p.name;$('pc').value=p.category||'';$('pp').value=p.price||0;$('pm').value=p.mrp||0;$('ps').value=p.stock??'';$('pi').value=p.image||'';$('pe').value=p.description||'';$('pa').checked=p.active!==false;scrollTo(0,0)});
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this product? This cannot be undone.')){await S.delProduct(b.dataset.d);P=await S.products();list()}})}
const clr=()=>{eid=null;$('pf').reset();$('pt').textContent='Add product'};$('pr').onclick=clr;
$('pu').onchange=e2=>{const i=new Image;i.onload=()=>{const k=Math.min(1,600/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);$('pi').value=c.toDataURL('image/jpeg',.7)};i.src=URL.createObjectURL(e2.target.files[0])};
$('pf').onsubmit=async ev=>{ev.preventDefault();const s=$('ps').value;await S.saveProduct({id:eid||'p'+Date.now().toString(36),name:$('pn').value.trim(),category:$('pc').value.trim()||'Other',price:+$('pp').value||0,mrp:+$('pm').value||0,stock:s===''?null:+s,image:$('pi').value.trim()||'assets/pc-building.jpg',description:$('pe').value.trim(),active:$('pa').checked});clr();P=await S.products();list()};
$('sf').onsubmit=async ev=>{ev.preventDefault();await S.saveSettings({shopName:$('s1').value.trim(),banner:$('s2').value.trim(),whatsapp:$('s3').value.replace(/\D/g,''),accent:$('s4').value,open:$('s5').checked});$('sm').textContent='Saved.'};
</script></body></html>
