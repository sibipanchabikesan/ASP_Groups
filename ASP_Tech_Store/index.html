<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#142c69">
  <meta name="description" content="Browse PC builds, components and tech products at ASP Tech Store.">
  <title>ASP Tech Store | Products</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<header><div class="w bar"><a class="logo" href="./index.html">ASP <b>TECH STORE</b></a><nav class="links" aria-label="Store"><a class="current" href="./index.html">Products</a></nav><button class="btn" id="checkoutButton" type="button">Checkout (<span id="cartCount">0</span>)</button></div></header>
<section class="shophero"><div class="w"><span class="eyebrow">ASP TECH STORE</span><h1>PCs, parts &amp; accessories</h1><p>Browse products, compare details and continue to the separate checkout page for delivery and payment options.</p></div></section>
<main class="w">
  <div class="tools"><input id="searchInput" type="search" placeholder="Search products" aria-label="Search products"><select id="sortSelect" aria-label="Sort products"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="name">Name A–Z</option></select></div>
  <div class="chips" id="categories"></div>
  <p id="resultCount" aria-live="polite">Loading products…</p>
  <div class="grid" id="productGrid"></div>
</main>
<dialog id="productDialog" aria-labelledby="productName">
  <button type="button" class="product-detail-close" id="closeProduct" aria-label="Close product details">×</button>
  <div class="product-detail"><img id="productImage" class="product-detail-image" src="../assets/pc-building.jpg" alt="">
    <div class="product-detail-copy"><p id="productCategory" class="product-detail-category"></p><h2 id="productName">Product details</h2>
      <div class="product-detail-prices"><strong id="productPrice"></strong><del id="productMrp"></del></div><p id="productStock" class="product-detail-stock"></p><p id="productDescription" class="product-detail-description"></p>
      <div class="product-detail-actions"><button class="btn" id="detailAdd" type="button">Add to cart</button><button class="btn g" id="detailBuy" type="button">Buy now</button></div>
    </div>
  </div>
</dialog>
<footer class="w" style="padding:22px 20px 32px;border-top:1px solid var(--ln)"><div class="row"><span>ASP Tech Store</span><a href="mailto:9996663210a@gmail.com">Contact</a><a href="./admin.html">Admin sign in</a></div></footer>
<script type="module">
import * as S from '../store.js';
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=value=>'₹'+Number(value||0).toLocaleString('en-IN');
const imageSrc=value=>!value?'../assets/pc-building.jpg':(/^https?:|^data:|^blob:/.test(value)?value:(value.startsWith('assets/')?'../'+value:value));
let products=[],category='All',selected=null,cart=JSON.parse(localStorage.getItem('asp_cart')||'{}');
const stockLimit=p=>p.stock==null?Infinity:Number(p.stock);
function saveCart(){localStorage.setItem('asp_cart',JSON.stringify(cart));const count=Object.values(cart).reduce((sum,n)=>sum+Number(n||0),0);$('cartCount').textContent=String(count);$('checkoutButton').disabled=count===0}
function addToCart(p){if(!p||stockLimit(p)<1)return;const qty=Number(cart[p.id]||0);if(qty>=stockLimit(p))return;cart[p.id]=qty+1;saveCart()}
function goCheckout(){if(Object.values(cart).reduce((s,n)=>s+Number(n||0),0)>0)location.href='./checkout.html'}
function buyNow(p){if(!p||stockLimit(p)<1)return;cart={[p.id]:1};saveCart();goCheckout()}
function showProduct(p){selected=p;$('productImage').src=imageSrc(p.image);$('productImage').alt=p.name||'Product';$('productCategory').textContent=p.category||'Product';$('productName').textContent=p.name||'Product';$('productPrice').textContent=Number(p.price)>0?money(p.price):'Price on request';$('productMrp').textContent=Number(p.mrp)>Number(p.price)?'MRP '+money(p.mrp):'';$('productStock').textContent=p.stock==null?'Availability confirmed before order':Number(p.stock)>0?Number(p.stock)+' in stock':'Out of stock';$('productDescription').textContent=p.description||'';$('detailAdd').disabled=stockLimit(p)<1;$('detailBuy').disabled=stockLimit(p)<1;$('productDialog').showModal()}
function draw(){const term=$('searchInput').value.trim().toLowerCase(),sort=$('sortSelect').value;let rows=products.filter(p=>(category==='All'||p.category===category)&&[p.name,p.category,p.description].join(' ').toLowerCase().includes(term));if(sort==='low')rows.sort((a,b)=>Number(a.price)-Number(b.price));if(sort==='high')rows.sort((a,b)=>Number(b.price)-Number(a.price));if(sort==='name')rows.sort((a,b)=>String(a.name).localeCompare(String(b.name)));$('resultCount').textContent=rows.length+' '+(rows.length===1?'product':'products');$('productGrid').innerHTML=rows.length?rows.map(p=>'<article class="card"><button type="button" class="product-image-open" data-detail="'+esc(p.id)+'"><img src="'+esc(imageSrc(p.image))+'" alt="'+esc(p.name)+'" loading="lazy" onerror="this.src=\'../assets/pc-building.jpg\'"></button><div class="b"><h3>'+esc(p.name)+'</h3><p>'+esc(p.description||'')+'</p><div class="pr">'+(Number(p.price)>0?money(p.price):'Quote')+(Number(p.mrp)>Number(p.price)?'<s>'+money(p.mrp)+'</s>':'')+'</div><div class="product-card-actions"><button class="btn g" type="button" data-detail="'+esc(p.id)+'">Details</button><button class="btn" type="button" data-add="'+esc(p.id)+'" '+(stockLimit(p)<1?'disabled':'')+'>Add</button><button class="btn g" type="button" data-buy="'+esc(p.id)+'" '+(stockLimit(p)<1?'disabled':'')+'>Buy now</button></div></div></article>').join(''):'<p>No products match your search.</p>';document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id===b.dataset.detail);if(p)showProduct(p)});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addToCart(products.find(x=>x.id===b.dataset.add)));document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buyNow(products.find(x=>x.id===b.dataset.buy)))}
function drawCategories(){const names=['All',...new Set(products.map(p=>p.category).filter(Boolean))];$('categories').innerHTML=names.map(name=>'<button class="chip '+(name===category?'on':'')+'" type="button" data-category="'+esc(name)+'">'+esc(name)+'</button>').join('');document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;drawCategories();draw()})}
$('searchInput').addEventListener('input',draw);$('sortSelect').addEventListener('change',draw);$('checkoutButton').addEventListener('click',goCheckout);$('closeProduct').onclick=()=>$('productDialog').close();$('detailAdd').onclick=()=>{if(selected)addToCart(selected)};$('detailBuy').onclick=()=>buyNow(selected);$('productDialog').addEventListener('click',e=>{if(e.target===$('productDialog'))$('productDialog').close()});
try{products=(await S.products()).filter(p=>p.active!==false);drawCategories();draw();saveCart()}catch(error){console.error(error);$('resultCount').textContent='Catalogue temporarily unavailable. Please refresh or contact the store.'}
</script>
</body>
</html>
