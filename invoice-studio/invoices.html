<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved Invoices · ASP Invoice Studio</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');:root{--ink:#172033;--muted:#778196;--line:#e7eaf0;--blue:#3158d6;--navy:#142348;--pale:#f4f6fa}*{box-sizing:border-box}body{margin:0;background:var(--pale);font-family:'DM Sans',sans-serif;color:var(--ink)}.top{height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(28px,calc((100vw - 1000px)/2))}.brand{display:flex;gap:12px;align-items:center;font:800 16px Manrope}.logo{width:36px;height:36px;object-fit:contain}.group-logo{width:38px;height:38px;object-fit:contain}.brand small{font:500 12px 'DM Sans';display:block;color:var(--muted);margin-top:2px}.btn{border-radius:9px;padding:10px 15px;font-weight:700;text-decoration:none;font-size:13px}.primary{background:var(--blue);color:white}main{max-width:1000px;margin:42px auto;padding:0 24px}.title{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}h1{font:800 26px Manrope;margin:0 0 5px}.sub,.count{font-size:13px;color:var(--muted)}.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.date-filters{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin-bottom:16px}.date-filters label{display:grid;gap:5px;font-size:10px;color:var(--muted);font-weight:700}.date-filters input{border:1px solid var(--line);border-radius:8px;padding:8px 9px;background:#fff;color:var(--ink);font:12px 'DM Sans'}.filter{background:#fff;border:1px solid var(--line);border-radius:20px;padding:8px 13px;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer}.filter.active{background:var(--navy);border-color:var(--navy);color:white}.count{font-weight:700}.card{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr auto auto;gap:14px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}.row:last-child{border:0}.head{background:#fafbfc;color:#8993a5;font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;padding-top:12px;padding-bottom:12px}.name,.amount{font-weight:700;font-size:13px}.meta{font-size:11px;color:var(--muted);margin-top:4px}.open{color:var(--blue);font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}.delete{border:0;background:none;color:#9ba3b2;cursor:pointer;font-size:17px}.empty{text-align:center;padding:64px 20px}.empty h2{font:700 16px Manrope;margin:0 0 7px}.empty p{color:var(--muted);font-size:12px;margin:0 0 18px}@media(max-width:750px){main{margin:26px auto;padding:0 13px}.row{grid-template-columns:1fr auto;gap:6px 12px;padding:14px}.head{display:none}.details,.business,.client,.date{grid-column:1}.amount,.action,.del{grid-column:2}.amount{grid-row:1}.action{grid-row:2}.del{grid-row:3}.title{align-items:start}h1{font-size:22px}.top{padding:0 14px}}

.theme-toggle{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:18px;cursor:pointer;display:grid;place-items:center}.theme-toggle:hover{filter:brightness(.96)}:root[data-theme="dark"]{--ink:#edf2fc;--muted:#a6b1c5;--line:#354057;--blue:#87a0ff;--navy:#e4eaff;--pale:#111827;color-scheme:dark}:root[data-theme="dark"] body{background:#111827;color:var(--ink)}:root[data-theme="dark"] .top,:root[data-theme="dark"] .panel,:root[data-theme="dark"] .paper,:root[data-theme="dark"] .card,:root[data-theme="dark"] .invoice-entry{background:#1b2434;color:var(--ink);border-color:var(--line)}:root[data-theme="dark"] .head{background:#202b3e;color:#a6b1c5}:root[data-theme="dark"] input,:root[data-theme="dark"] textarea,:root[data-theme="dark"] select{background:#141d2b;color:var(--ink);border-color:var(--line)}:root[data-theme="dark"] .btn.secondary,:root[data-theme="dark"] .theme-toggle,:root[data-theme="dark"] .filter{background:#202b3e;color:var(--ink);border-color:var(--line)}:root[data-theme="dark"] .filter.active{background:#87a0ff;color:#10182b}:root[data-theme="dark"] .table td{border-color:#30394c}:root[data-theme="dark"] .table th{border-color:#3b455b;color:#a6b1c5}:root[data-theme="dark"] .sumline.grand{border-color:var(--line);color:var(--ink)}:root[data-theme="dark"] .notes{border-color:var(--line)}:root[data-theme="dark"] .invoice-entry{border-color:var(--line)}:root[data-theme="dark"] .empty{color:var(--muted)}:root[data-theme="dark"] .qrbox img,:root[data-theme="dark"] .saved-payment img{border-color:var(--line)}@media print{:root[data-theme="dark"] body,:root[data-theme="dark"] .paper{background:#fff!important;color:#172033!important}:root[data-theme="dark"] .paper{border:0}:root[data-theme="dark"] .company-meta,:root[data-theme="dark"] .bill-details,:root[data-theme="dark"] .notes-text,:root[data-theme="dark"] .sumline{color:#68748a!important}:root[data-theme="dark"] .table td,:root[data-theme="dark"] .table th{color:#172033!important;border-color:#e7eaf0!important}}
</style></head><body><header class="top"><div class="brand"><img class="group-logo" src="asp-groups-salem.jpg" alt="ASP Groups Salem logo"><div>Invoice Studio<small>Saved invoices · Salem</small></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">☾</button><a class="btn secondary" href="invoice.html" style="border:1px solid var(--line);background:#fff;color:var(--ink)">⌂ Home</a><a class="btn secondary" href="settings.html" style="border:1px solid var(--line);background:#fff;color:var(--ink)">Settings</a><button class="btn primary" id="exportExcel">Export Excel</button><a class="btn primary" href="invoice.html">＋ New invoice</a></div></header><main><div class="title"><div><h1>Raised invoices</h1><div class="sub">Your saved invoices, ready to review or edit.</div></div><div class="count" id="count"></div></div><div class="filters"><button class="filter active" data-business="all">All invoices</button><button class="filter" data-business="ASP Tech Solution">ASP Tech Solution</button><button class="filter" data-business="ASP &amp; Auditors">ASP &amp; Auditors</button></div><div class="date-filters"><label>Invoice date from<input id="dateFrom" type="date"></label><label>Invoice date to<input id="dateTo" type="date"></label><button class="btn secondary" id="clearDates" type="button">Clear dates</button></div><div class="card"><div class="row head"><div>Invoice</div><div>Business</div><div>Client</div><div>Issue date</div><div>Amount</div><div></div><div></div></div><div id="list"></div></div></main><script>
function money(v,c){return(c||'₹')+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}function date(v){return v?new Date(v+'T00:00:00').toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}):'—'}function total(d){let isAuditors=d.business==='ASP & Auditors',sub=(d.items||[]).reduce((s,i)=>s+(isAuditors?1:(Number(i.qty)||0))*(Number(i.rate)||0),0),r=d.tax==='custom'?Number(d.customTax||0):Number(d.tax||0);return sub+sub*r/100}let activeBusiness='all';document.getElementById('dateFrom').addEventListener('input',render);document.getElementById('dateTo').addEventListener('input',render);document.getElementById('clearDates').onclick=()=>{document.getElementById('dateFrom').value='';document.getElementById('dateTo').value='';render()};function dateFiltered(list){const from=document.getElementById('dateFrom').value,to=document.getElementById('dateTo').value;return list.filter(x=>{const d=(x.data||{}).issueDate||'';return(!from||d>=from)&&(!to||d<=to)})}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{activeBusiness=b.dataset.business;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});function render(){let all=[];try{all=JSON.parse(localStorage.getItem('asp-invoices')||'[]')}catch{}let data=dateFiltered(activeBusiness==='all'?all:all.filter(x=>(x.data||{}).business===activeBusiness));document.getElementById('count').textContent=data.length+' invoice'+(data.length===1?'':'s');const root=document.getElementById('list');root.innerHTML='';if(!data.length){root.innerHTML='<div class="empty"><h2>No invoices match the selected filters</h2><p>Try changing the business or date filters, or create a new invoice.</p><a class="btn primary" href="invoice.html">Create an invoice</a></div>';return}data.forEach(inv=>{const d=inv.data||{},row=document.createElement('div');row.className='row';row.innerHTML='<div class="details"><div class="name"></div><div class="meta due"></div></div><div class="business meta"></div><div class="client name"></div><div class="date meta"></div><div class="amount"></div><div class="action"><a class="open">Edit →</a></div><div class="del"><button class="delete" title="Delete invoice">×</button></div>';row.querySelector('.details .name').textContent=d.invoiceNo||'Invoice';row.querySelector('.due').textContent='Due '+date(d.dueDate);row.querySelector('.business').textContent=d.business||'—';row.querySelector('.client').textContent=d.client||'—';row.querySelector('.date').textContent=date(d.issueDate);row.querySelector('.amount').textContent=money(total(d),d.currency);row.querySelector('.open').href='invoice.html?edit='+encodeURIComponent(inv.id);row.querySelector('.delete').onclick=()=>{if(confirm('Delete this invoice?')){localStorage.setItem('asp-invoices',JSON.stringify(data.filter(x=>x.id!==inv.id)));render()}};root.appendChild(row)})}render();

function xmlEscape(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}function xCell(v){if(typeof v==='number'&&Number.isFinite(v))return '<c t="n"><v>'+v+'</v></c>';return '<c t="inlineStr"><is><t xml:space="preserve">'+xmlEscape(v)+'</t></is></c>'}function crc32(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0}function le16(n){return Uint8Array.of(n&255,(n>>>8)&255)}function le32(n){return Uint8Array.of(n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255)}function joinBytes(parts){const size=parts.reduce((n,p)=>n+p.length,0),out=new Uint8Array(size);let at=0;for(const p of parts){out.set(p,at);at+=p.length}return out}function zipStore(files){const enc=new TextEncoder(),local=[],central=[];let offset=0;for(const [name,content] of files){const n=enc.encode(name),d=enc.encode(content),crc=crc32(d);const lh=joinBytes([le32(0x04034b50),le16(20),le16(0x0800),le16(0),le16(0),le16(0),le32(crc),le32(d.length),le32(d.length),le16(n.length),le16(0),n,d]);local.push(lh);const ch=joinBytes([le32(0x02014b50),le16(20),le16(20),le16(0x0800),le16(0),le16(0),le16(0),le32(crc),le32(d.length),le32(d.length),le16(n.length),le16(0),le16(0),le16(0),le16(0),le32(0),le32(offset),n]);central.push(ch);offset+=lh.length}const cd=joinBytes(central),body=joinBytes(local),end=joinBytes([le32(0x06054b50),le16(0),le16(0),le16(files.length),le16(files.length),le32(cd.length),le32(body.length),le16(0)]);return joinBytes([body,cd,end])}function exportExcel(){let data=[];try{data=JSON.parse(localStorage.getItem('asp-invoices')||'[]')}catch{}data=dateFiltered(activeBusiness==='all'?data:data.filter(x=>(x.data||{}).business===activeBusiness));if(!data.length){alert('No invoices match the selected business and date filters.');return}const profiles=(()=>{try{return JSON.parse(localStorage.getItem('asp-business-details')||'{}')}catch{return {}}})();const headers=['Business','Invoice No','Client','Client Details','Issue Date','Due Date','Description','Unit','Quantity','Rate','Line Amount','Tax Rate %','Tax Amount','Invoice Total','Currency','Business Email','Phone','Address','GSTIN','Bank','Account Name','Account Number','IFSC','Branch','UPI','Payment Instructions'];const rows=[headers];for(const inv of data){const d=inv.data||{},p=profiles[d.business]||{},audit=d.business==='ASP & Auditors',items=d.items?.length?d.items:[{description:'',unit:'',qty:1,rate:0}];const sub=items.reduce((a,it)=>a+(audit?1:(Number(it.qty)||0))*(Number(it.rate)||0),0),taxRate=d.tax==='custom'?Number(d.customTax||0):Number(d.tax||0),tax=sub*taxRate/100,total=sub+tax;for(const it of items){const qty=audit?1:(Number(it.qty)||0);rows.push([d.business,d.invoiceNo,d.client,d.clientInfo,d.issueDate,d.dueDate,it.description,it.unit||'',qty,Number(it.rate)||0,qty*(Number(it.rate)||0),taxRate,tax,total,d.currency||'₹',p.bizEmail||d.bizEmail||'',(p.bizPhone||d.bizPhone||'')+(p.phoneAlt?' / '+p.phoneAlt:''),p.bizAddress||d.bizAddress||'',p.gst||d.gst||'',p.bankName||'',p.accountName||'',p.accountNumber||'',p.ifsc||'',p.branch||'',p.upi||'',p.paymentInstructions||d.payment||''])}}const xmlRows=rows.map(row=>'<row>'+row.map(v=>xCell(v)).join('')+'</row>').join('');const sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+xmlRows+'</sheetData></worksheet>';const contentTypes='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>';const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';const workbook='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Invoices" sheetId="1" r:id="rId1"/></sheets></workbook>';const wrels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>';const bytes=zipStore([['[Content_Types].xml',contentTypes],['_rels/.rels',rels],['xl/workbook.xml',workbook],['xl/_rels/workbook.xml.rels',wrels],['xl/worksheets/sheet1.xml',sheet]]);const url=URL.createObjectURL(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})),a=document.createElement('a');a.href=url;a.download='ASP-Invoices-'+new Date().toISOString().slice(0,10)+'.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.getElementById('exportExcel').addEventListener('click',exportExcel);
function loadLogo(img,path){if(location.protocol==='file:'){img.src=path;return}fetch(path+'.b64',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('logo unavailable');return r.text()}).then(b64=>{img.src='data:image/jpeg;base64,'+b64.trim()}).catch(()=>{img.alt='ASP Groups logo'})}document.querySelectorAll('.group-logo').forEach(img=>loadLogo(img,'asp-groups-salem.jpg'));function initTheme(){const root=document.documentElement,btn=document.getElementById('themeToggle');function apply(mode){root.dataset.theme=mode;const dark=mode==='dark';btn.textContent=dark?'☀':'☾';btn.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');btn.title=dark?'Switch to light mode':'Switch to dark mode'}apply(localStorage.getItem('asp-theme')||'light');btn.addEventListener('click',()=>{const next=root.dataset.theme==='dark'?'light':'dark';localStorage.setItem('asp-theme',next);apply(next)})}initTheme();</script></body></html>
